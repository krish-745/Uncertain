<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Uncertain Lang Playground</title>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
    <style>
        body { margin: 0; padding: 0; display: flex; height: 100vh; font-family: sans-serif; }
        #editor { width: 50%; height: 100%; border-right: 1px solid #ccc; }
        #output-panel { width: 50%; height: 100%; padding: 20px; box-sizing: border-box; background: #f5f5f5; overflow-y: auto; }
        pre { white-space: pre-wrap; margin: 0; }
        .error { color: red; }
    </style>
</head>
<body>
    <div id="editor"></div>
    <div id="output-panel">
        <h3>Output & Diagnostics</h3>
        <pre id="output">Loading Pyodide...</pre>
    </div>

    <script>
        let pyodide;
        let editor;

        async function initPyodide() {
            pyodide = await loadPyodide();
            await pyodide.loadPackage("micropip");
            const micropip = pyodide.pyimport("micropip");
            try {
                await micropip.install('../dist/uncertain_lang-0.5.2-py3-none-any.whl');
                document.getElementById("output").textContent = "Ready! Type some code...";
            } catch (e) {
                document.getElementById("output").textContent = "Error loading uncertain lang: " + e;
            }
        }

        function runCode() {
            if (!pyodide) return;
            const code = editor.getValue();
            
            const pythonScript = `
import json
from uncertain.parser import parse, ParseError
from uncertain.lexer import LexerError
from uncertain.typechecker import TypeContext, check_stmt
from uncertain.diagnostics import format_diagnostic

def check_code(source):
    try:
        stmts, expr = parse(source)
    except (ParseError, LexerError) as e:
        return json.dumps({"status": "error", "message": str(e)})
        
    ctx = TypeContext()
    all_diags = []
    for stmt in stmts:
        all_diags.extend(check_stmt(stmt, ctx))
        
    errors = [d for d in all_diags if d.severity == "error"]
    
    out = ""
    source_lines = source.splitlines()
    for diag in all_diags:
        out += format_diagnostic(diag, source_lines) + "\\n\\n"
        
    if not all_diags:
        out += "Typecheck passed.\\n"
        
    for name, typ in ctx.bindings.items():
        out += f"{name} = (mean={typ.dist.mean:.4f}, stddev={typ.dist.stddev:.4f})\\n"
        
    return json.dumps({"status": "ok", "output": out})

check_code(code_to_check)
            `;
            
            pyodide.globals.set("code_to_check", code);
            try {
                const resultStr = pyodide.runPython(pythonScript);
                const result = JSON.parse(resultStr);
                const outEl = document.getElementById("output");
                if (result.status === "error") {
                    outEl.innerHTML = '<span class="error">' + result.message + '</span>';
                } else {
                    outEl.textContent = result.output;
                }
            } catch (e) {
                document.getElementById("output").textContent = e.toString();
            }
        }

        require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs' }});
        require(['vs/editor/editor.main'], function() {
            editor = monaco.editor.create(document.getElementById('editor'), {
                value: [
                    'let a = sensor_read();',
                    'let b = a * 2.0;',
                    'let c = a * b; // uncertain-reuse error',
                ].join('\\n'),
                language: 'javascript', // fallback syntax
                theme: 'vs-dark'
            });
            
            editor.onDidChangeModelContent(() => {
                runCode();
            });
            
            initPyodide().then(() => runCode());
        });
    </script>
</body>
</html>
