name: Smoke Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        
    - name: Install hatch and dependencies
      run: |
        python -m pip install --upgrade pip
        pip install hatch
        
    - name: Install package
      run: |
        pip install .
        
    - name: Run Pytest
      run: |
        pytest tests/
        
    - name: Smoke Test CLI
      run: |
        uncertain examples/my_experiment.calc
