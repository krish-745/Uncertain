name: Smoke Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install package
      run: |
        python -m pip install --upgrade pip
        pip install .[dev]

    - name: Run Pytest
      run: |
        pytest tests/

    - name: Smoke Test CLI
      run: |
        uncertain --version
        python -c "import uncertain.server"
        for f in examples/*.calc; do
          if [ "$(basename "$f")" = "bad_math.calc" ]; then
            # intentionally invalid: must report an error and exit 1
            if uncertain "$f"; then echo "expected $f to fail"; exit 1; fi
          else
            uncertain "$f"
          fi
        done
