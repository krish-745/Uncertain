[project]
name = "uncertain-lang"
version = "1.0.1"
description = "A domain-specific language for safe, compile-time tracking of distributional uncertainty and correlations."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["uncertainty", "error propagation", "probability", "statistics", "dsl", "compiler", "affine arithmetic"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Compilers",
]
dependencies = [
    "pygls>=2.1.1",
]

[project.optional-dependencies]
dev = [
    "numpy>=2.2.3",
    "pytest>=8.3.4",
    "hypothesis>=6.126.0",
    "uncertainties>=3.1.7",
]

[project.scripts]
uncertain = "uncertain.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uncertain"]

[project.urls]
Homepage = "https://github.com/krish-745/Uncertain"
Repository = "https://github.com/krish-745/Uncertain"
Changelog = "https://github.com/krish-745/Uncertain/blob/main/CHANGELOG.md"
Issues = "https://github.com/krish-745/Uncertain/issues"
