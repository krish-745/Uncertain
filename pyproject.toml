[project]
name = "uncertain-lang"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.2.3",
    "pytest>=8.3.4",
    "hypothesis>=6.126.0",
    "uncertainties>=3.1.7",
]

[project.scripts]
uncertain = "uncertain.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uncertain"]
